server {
  listen 8080;
  absolute_redirect off;

  # The build is copied to <root>/storybook (see storybook.Dockerfile) so every location below
  # can use `root`. The previous config used `alias`, which resolves against a path few readers
  # expect and is how a dead location went unnoticed: it aliased /storybook/assets/, a directory
  # Storybook 10 does not emit, so every response fell through to `no-store`.
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  # nginx has mapped .js to text/javascript since 1.21.1; application/javascript alone would
  # compress none of the bundles. Fonts are already compressed and are deliberately absent.
  gzip_types text/javascript application/javascript text/css application/json image/svg+xml;

  location = /storybook {
    return 301 /storybook/;
  }

  # Content-hashed filenames: the hash changes whenever the bytes do, so the URL is immutable.
  # The regex is quoted because nginx would otherwise read the {8,} braces as a block.
  location ~ "^/storybook/.+\.[0-9a-f]{8,}\.[^/]*$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else: index.html, iframe.html, index.json, the fonts, and the whole of sb-manager/,
  # sb-preview/, sb-addons/ and sb-common-assets/, whose filenames are stable across builds.
  # Marking those immutable would pair a stale runtime with a fresh index.html. `no-cache` still
  # lets nginx answer with a 304 from its ETag, so a repeat visit costs ~20 conditional requests
  # instead of 12 MB.
  location /storybook/ {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html =404;
  }
}
