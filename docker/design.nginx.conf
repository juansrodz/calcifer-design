server {
  listen 8080;
  absolute_redirect off;

  # The build is copied to <root>/design (see design.Dockerfile) so every location below can use
  # `root` rather than `alias`: a regex location with `alias` and `try_files` is a known nginx
  # foot-gun, and it is how a dead location went unnoticed in the Storybook image.
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  # nginx defaults gzip_proxied to off, which skips compression for anything it believes came
  # through a proxy. Traefik sets no Via header today, so this is latent rather than dead.
  gzip_proxied any;
  # nginx has mapped .js to text/javascript since 1.21.1; application/javascript alone would
  # compress none of the bundles. mf-manifest.json is why application/json is here.
  gzip_types text/javascript application/javascript text/css application/json image/svg+xml;

  location = /design {
    return 301 /design/;
  }

  # Rsbuild writes content-hashed chunks under static/: the hash changes whenever the bytes do,
  # so the URL is immutable. Quoted because nginx would otherwise read the {8,} braces as a block.
  location ~ "^/design/static/.+\.[0-9a-f]{8,}\.[^/]*$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Everything else: index.html, mf-manifest.json, build-info.json, and any asset whose name is
  # stable across builds. `no-cache` still lets nginx answer 304 from its ETag, so a repeat visit
  # is cheap. The manifest and the build stamp in particular must never be pinned: the shell reads
  # the manifest to find this build's chunks, and the portfolio's cards read build-info.json for
  # the version and commit they display — a stale copy of either is wrong the moment a new image
  # ships.
  location /design/ {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html =404;
  }
}
