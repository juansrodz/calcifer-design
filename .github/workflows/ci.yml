name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Manual trigger for release recovery: a fresh run on the current head of main. Re-running
  # a failed run replays its original commit, which re-applies changesets already consumed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Every changed package has a changeset
        if: github.event_name == 'pull_request'
        run: bun run changeset:status
      - run: bun run check

  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Staged publishing needs npm 11.15.0 or newer; Node 22 ships npm 10 and already
      # satisfies npm 11.15's Node 22.14 floor.
      - run: npm install -g npm@^11.15.0 && npm --version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # Set before any git write: the version commit below and the annotated tags
      # `changeset tag` creates in the release step both need an identity, and Changesets
      # does not fail when `git tag -m` is refused for lack of one.
      - name: Git identity for the release bot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Apply pending changesets and push the version commit to main
        run: |
          if find .changeset -name '*.md' ! -name README.md | grep -q .; then
            ./node_modules/.bin/changeset version
            bun run lock:sync
            bun install --frozen-lockfile
            git add -A
            git commit -m 'chore(release): version packages'
            git push origin HEAD:main
          else
            echo 'no pending changesets; publishing anything the registry is missing'
          fi
      - run: bun run build
      - name: Stage unpublished versions on npmjs (trusted publishing)
        run: bun run release
      - name: Push the release tags
        run: git push origin --tags

  pages:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run storybook:build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: packages/ui/storybook-static
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  storybook-image:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: pages
    runs-on: ubuntu-latest
    concurrency:
      group: storybook-image
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run storybook:build
      - id: meta
        run: |
          echo "sha12=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "uiVersion=$(bun -e 'console.log(require("./packages/ui/package.json").version)')" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/storybook.Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ vars.ECR_REGISTRY }}/portfolio/storybook:${{ steps.meta.outputs.sha12 }}
          cache-from: type=gha,scope=storybook
          cache-to: type=gha,scope=storybook,mode=max
      - name: Ask the portfolio to deploy this Storybook
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
          repository: juansrodz/portfolio-mfe
          event-type: storybook-image
          client-payload: '{"tag":"${{ steps.meta.outputs.sha12 }}","uiVersion":"${{ steps.meta.outputs.uiVersion }}"}'
